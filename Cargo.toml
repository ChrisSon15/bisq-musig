[workspace]
resolver = "3"
members = ["chain", "protocol", "rpc", "wallet", "testenv", "bmp_tracing", "mem"]

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", default-features = false }
base64 = "0.22.1"
bdk_bitcoind_rpc = "0.22.0"
bdk_electrum = { version = "0.23.2", default-features = false, features = ["use-rustls-ring"] }
bdk_kyoto = "0.17.0"
bdk_wallet = { version = "3.1.0", features = ["rusqlite", "keys-bip39"] }
bmp_tracing = { path = "bmp_tracing" }
chain = { path = "chain" }
clap = { version = "4.6.5", features = ["derive"] }
const_format = "0.2.36"
hex = "0.4.3"
musig2 = { version = "0.4.1", features = ["rand"] }
protocol = { path = "protocol" }
rand = "0.9.4"
rand_chacha = "0.9.0"
rusqlite = { version = "0.31.0", features = ["bundled-sqlcipher"] }
secp = "0.7.0"
tempfile = "3.27.0"
testenv = { path = "testenv" }
thiserror = "2.0.19"
tokio = "1.53.1"
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-core = { version = "0.1.36", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trait-variant = "0.1.3"
wallet = { path = "wallet" }
zeroize = "1.9.0"

[workspace.lints.rust]
rust-2024-compatibility = "warn"
unused-qualifications = "warn"
# Most of the time, changing drop order is harmless ('rust-2024-compatibility' lint):
tail_expr_drop_order = { level = "allow", priority = 1 }
# Macros aren't usually exported and the 'expr' match widening is minor ('rust-2024-compatibility' lint):
edition_2024_expr_fragment_specifier = { level = "allow", priority = 1 }

[workspace.lints.clippy]
pedantic = "warn"
# Enable selected 'nursery' and 'restriction' lints...
allow_attributes = "warn"
branches_sharing_code = "warn"
exhaustive_enums = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
missing_const_for_fn = "warn"
renamed_function_params = "warn"
str_to_string = "warn"
try_err = "warn"
unused_trait_names = "warn"
use_self = "warn"
# Probably counterproductive to document errors of all publicly visible fns before the code has matured:
missing_errors_doc = { level = "allow", priority = 1 }
# Panics shall generally only result from bugs in callee code, so this gives too many false positives:
missing_panics_doc = { level = "allow", priority = 1 }
# Probably shouldn't annotate every (public) pure fn with '#[must_use]', so too many false positives:
must_use_candidate = { level = "allow", priority = 1 }
