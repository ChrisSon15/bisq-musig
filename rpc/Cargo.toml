[package]
name = "rpc"
version = "0.1.0"
# Hold at 2021 for now, since adapting to Rust 2024 needs syntax that the open source IDEA Rust plugin can't yet handle:
edition = "2021"

[dependencies]
anyhow = { workspace = true }
bdk_wallet = { workspace = true }
chain = { workspace = true }
drop-stream = "0.3.2"
futures-util = { version = "0.3.33", default-features = false, features = ["alloc"] }
musig2 = { workspace = true }
prost = "0.14.4"
protocol = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_with = { version = "3.21.0", features = ["base64", "hex"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true }
tokio-util = "0.7.19"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = { workspace = true }
wallet = { workspace = true }
zeroize = { workspace = true }
# Dependencies used only by the binary target(s):
# TODO: Consider making a workspace of separate packages to avoid pulling these into the library:
bmp_tracing = { workspace = true }
clap = { workspace = true }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
# The wallet service tests give a wallet coins without a chain.
bdk_wallet = { workspace = true, features = ["test-utils"] }
# The service tests use the mock wallets of the protocol crate.
protocol = { workspace = true, features = ["test-utils"] }
rand = { workspace = true }
tempfile = { workspace = true }
# The blackbox tests read the imported keys of a wallet.
wallet = { workspace = true, features = ["test-utils"] }
testenv = { workspace = true }

[lints]
workspace = true
