[package]
name = "rpc"
version = "0.1.0"
# Hold at 2021 for now, since adapting to Rust 2024 needs syntax that the open source IDEA Rust plugin can't yet handle:
edition = "2021"
default-run = "musig-cli"

[dependencies]
anyhow = { workspace = true }
bdk_bitcoind_rpc = { workspace = true }
bdk_wallet = { workspace = true }
drop-stream = "0.3.2"
futures-util = { version = "0.3.33", default-features = false, features = ["alloc"] }
guardian = "1.3.0"
musig2 = { workspace = true }
prost = "0.14.4"
protocol = { workspace = true }
rand = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_with = { version = "3.21.0", features = ["base64", "hex"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-stream = { workspace = true }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = { workspace = true }
unimock = { version = "0.6.8", optional = true }
# Dependencies used only by the binary target(s):
# TODO: Consider making a workspace of separate packages to avoid pulling these into the library:
bmp_tracing = { workspace = true }
clap = { workspace = true }
wallet = { workspace = true }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
rpc = { path = ".", features = ["unimock"] }
assert_cmd = "2.2.2"
bdk_electrum = { workspace = true }
chain = { workspace = true }
const_format = { workspace = true }
predicates = "3.1.4"
testenv = { workspace = true }
# Pin transitive 'unimock' dependency, as v0.2.3 replaces 'paste' with less reputable 'pastey' to fix a bogus advisory:
macro_rules_attribute = "=0.2.2"

[lints]
workspace = true
