syntax = "proto3";
package musigrpc;

service Musig {
  rpc InitTrade (PubKeySharesRequest) returns (PubKeySharesResponse);

  rpc GetNonceShares (NonceSharesRequest) returns (NonceSharesMessage);

  rpc GetPartialSignatures (PartialSignaturesRequest) returns (PartialSignaturesMessage);

  rpc SignDepositTx (DepositTxSignatureRequest) returns (DepositPsbt);

  rpc PublishDepositTx (PublishDepositTxRequest) returns (stream TxConfirmationStatus);

  rpc SubscribeTxConfirmationStatus (SubscribeTxConfirmationStatusRequest) returns (stream TxConfirmationStatus);

  rpc SignSwapTx (SwapTxSignatureRequest) returns (SwapTxSignatureResponse);

  rpc CloseTrade (CloseTradeRequest) returns (CloseTradeResponse);

  rpc SignCustomPayoutTx (CustomPayoutPsbtRequest) returns (CustomPayoutPsbt);

  rpc CustomCloseTrade (CustomCloseTradeRequest) returns (CustomCloseTradeResponse);

  // Ends a trade whose deposit transaction the trader has not signed yet, and releases the coins of the wallet that
  // were reserved for it. Refused in every later state.
  rpc AbandonTrade (AbandonTradeRequest) returns (AbandonTradeResponse);

  // Starts a dispute: the trader decides to publish his warning transaction. Refused unless the trade is open, the
  // deposit transaction has as many confirmations as the warning lock time, and both payouts are unspent. The service
  // sends the transaction and sends it again until a warning transaction is confirmed.
  rpc PublishWarningTx (PublishWarningTxRequest) returns (PublishWarningTxResponse);

  // The events of one trade. The first event reports the current state of the trade. Later events report every change
  // of the state, every transaction that the service sends for the trade, the confirmations of the transactions of
  // the trade, a loss, an event on the chain that the service does not expect, a change of the deadlines or of the
  // actions that the user must take, and the start and the end of a problem with the peers of the Bitcoin network.
  rpc SubscribeTradeEvents (SubscribeTradeEventsRequest) returns (stream TradeEvent);
}

// TODO: Same as 'trade.TradeRole' from Bisq2 protos (minus 'UNSPECIFIED' variant, which should probably be added):
enum Role {
  SELLER_AS_MAKER = 0;
  SELLER_AS_TAKER = 1;
  BUYER_AS_MAKER = 2;
  BUYER_AS_TAKER = 3;
}

message ReceiverAddressAndAmount {
  string address = 1;
  uint64 amount = 2; // sats
}

message ContractualTxIds {
  string depositTxId = 1;
  string buyersWarningTxId = 2;
  string sellersWarningTxId = 3;
  string buyersRedirectTxId = 4;
  string sellersRedirectTxId = 5;
}

message PubKeySharesRequest {
  string tradeId = 1;
  Role myRole = 2;
}

message PubKeySharesResponse {
  bytes buyerOutputPubKeyShare = 1;
  bytes sellerOutputPubKeyShare = 2;
  bytes multisigScriptKey = 3;
  uint32 currentBlockHeight = 4;
}

message NonceSharesRequest {
  string tradeId = 1;
  bytes buyerOutputPeersPubKeyShare = 2;
  bytes sellerOutputPeersPubKeyShare = 3;
  bytes peersMultisigScriptKey = 4;
  uint64 depositTxFeeRate = 5;       // sats per kwu
  uint64 preparedTxFeeRate = 6;      // sats per kwu
  uint64 tradeAmount = 7;            // sats
  uint64 buyersSecurityDeposit = 8;  // sats
  uint64 sellersSecurityDeposit = 9; // sats
  optional ReceiverAddressAndAmount tradeFeeReceiver = 10;
}

message NonceSharesMessage {
  string warningTxFeeBumpAddress = 1;
  string redirectTxFeeBumpAddress = 2;
  // The address of the trader's wallet that receives his output of a custom payout, of his penalty transaction and
  // of his claim transaction.
  string claimTxPayoutAddress = 3;
  bytes halfDepositPsbt = 4;
  uint64 redirectionAmountMsat = 5; // (millisatoshis)
  bytes swapTxInputNonceShare = 6;
  bytes buyersWarningTxBuyerInputNonceShare = 7;
  bytes buyersWarningTxSellerInputNonceShare = 8;
  bytes sellersWarningTxBuyerInputNonceShare = 9;
  bytes sellersWarningTxSellerInputNonceShare = 10;
  bytes buyersRedirectTxInputNonceShare = 11;
  bytes sellersRedirectTxInputNonceShare = 12;
  // The claim transaction is not pre-signed. A trader builds and signs it alone when he needs it.
  reserved 13, 14;
  reserved "buyersClaimTxInputNonceShare", "sellersClaimTxInputNonceShare";
}

message PartialSignaturesRequest {
  string tradeId = 1;
  optional NonceSharesMessage peersNonceShares = 2;
  repeated ReceiverAddressAndAmount redirectionReceivers = 3;
  bool buyerReadyToRelease = 4;
}

message PartialSignaturesMessage {
  bytes peersWarningTxBuyerInputPartialSignature = 1;
  bytes peersWarningTxSellerInputPartialSignature = 2;
  bytes peersRedirectTxInputPartialSignature = 3;
  reserved 4;
  reserved "peersClaimTxInputPartialSignature";
  optional bytes swapTxInputPartialSignature = 5;
  optional bytes swapTxInputSighash = 6;
  optional ContractualTxIds contractualTxIds = 7;
}

message DepositTxSignatureRequest {
  string tradeId = 1;
  PartialSignaturesMessage peersPartialSignatures = 2;
}

message DepositPsbt {
  bytes depositPsbt = 1;
}

message PublishDepositTxRequest {
  string tradeId = 1;
  DepositPsbt peersDepositPsbt = 2;
}

message SubscribeTxConfirmationStatusRequest {
  string tradeId = 1;
}

message TxConfirmationStatus {
  bytes tx = 1;
  uint32 currentBlockHeight = 2;
  uint32 numConfirmations = 3;
}

message SwapTxSignatureRequest {
  string tradeId = 1;
  bytes swapTxInputPeersPartialSignature = 2;
  bool sellerReadyToRelease = 3;
}

message SwapTxSignatureResponse {
  //bytes swapTx = 1; // removed
  optional bytes peerOutputPrvKeyShare = 2;
}

message CloseTradeRequest {
  string tradeId = 1;
  optional bytes myOutputPeersPrvKeyShare = 2;
  optional bytes swapTx = 3;
  optional uint64 penaltyTxFeeRate = 4;
}

message CloseTradeResponse {
  optional bytes peerOutputPrvKeyShare = 1;
  optional bytes swapTx = 2;
  optional bytes penaltyTx = 3;
}

message CustomPayoutPsbtRequest {
  string tradeId = 1;
  uint64 sellersPayoutAmountExcludingFee = 2; // sats
  uint64 feeRate = 3; // sats per kwu
}

message CustomPayoutPsbt {
  bytes psbt = 1;
  string txId = 2;
  uint64 buyersPayoutAmountIncludingFee = 3;  // sats
  uint64 sellersPayoutAmountIncludingFee = 4; // sats
}

message CustomCloseTradeRequest {
  string tradeId = 1;
  bytes peersCustomPayoutPsbt = 2;
}

message CustomCloseTradeResponse {
  bytes customPayoutTx = 1;
}

message AbandonTradeRequest {
  string tradeId = 1;
}

message AbandonTradeResponse {
}

message PublishWarningTxRequest {
  string tradeId = 1;
}

message PublishWarningTxResponse {
  bytes warningTx = 1;
}

message SubscribeTradeEventsRequest {
  string tradeId = 1;
}

enum TradeEventType {
  // The state of the trade: the first event of a stream, and every change of the state. After a reorganisation of the
  // chain the new state can be an earlier state of the trade.
  STATE = 0;
  // The service sent a transaction of the trade to the network. This does not mean that a node accepted it.
  TX_SENT = 1;
  // The peer took funds of the trader with a claim or a penalty transaction.
  LOSS = 2;
  // Something happened on the chain that the service does not expect. No state changed.
  UNEXPECTED = 3;
  // No peer of the Bitcoin network is reachable, or no peer serves compact block filters. The chain is not observed
  // and nothing can be sent until the event CHAIN_PROBLEM_OVER.
  CHAIN_PROBLEM = 4;
  CHAIN_PROBLEM_OVER = 5;
  // The number of confirmations of a transaction of the trade changed. It is reported from the first confirmation
  // until the transaction counts as confirmed (3 confirmations), and with 0 if a reorganisation removed the
  // transaction.
  TX_CONFIRMED = 6;
  // A deadline, a required action of the user, the terminated mark or the final mark of the trade changed, and the
  // state did not.
  STATUS = 7;
}

enum TradeStateKind {
  INIT = 0;
  DEPOSIT = 1;
  BUYER_READY_TO_RELEASE = 2;
  SELLER_READY_TO_RELEASE = 3;
  CUSTOM_PAYOUT_SIGNED = 4;
  BUYERS_WARNING = 5;
  SELLERS_WARNING = 6;
  TRADE_CLOSED = 7;
}

enum ClosureKind {
  COOPERATIVE = 0;
  FORCED = 1;
  CUSTOM = 2;
  BUYERS_REDIRECT = 3;
  SELLERS_REDIRECT = 4;
  BUYERS_CLAIM = 5;
  SELLERS_CLAIM = 6;
  BUYERS_PENALTY_TX = 7;
  SELLERS_PENALTY_TX = 8;
  ABANDONED = 9;
  DEPOSIT_ABORTED = 10;
}

enum TradeTxKind {
  DEPOSIT_TX = 0;
  DEPOSIT_ABORT_TX = 1;
  SWAP_TX = 2;
  CUSTOM_PAYOUT_TX = 3;
  WARNING_TX = 4;
  REDIRECT_TX = 5;
  CLAIM_TX = 6;
  PENALTY_TX = 7;
}

// A point in time of a trade at which a rule of the service changes. The rule changes when the last block of the chain
// has the height of the deadline.
enum TradeDeadlineKind {
  // The deposit transaction is unconfirmed. At this height the service sends the deposit abort transaction.
  DEPOSIT_TIMEOUT = 0;
  // From this height on a warning transaction is valid: PublishWarningTx is accepted, and a warning transaction of
  // either trader can be in the next block.
  WARNING_LOCK_TIME = 1;
  // The last height at which the seller's release is accepted.
  LAST_RELEASE = 2;
  // The seller has released and the buyer has not answered. At this height the seller's service publishes the swap
  // transaction on its own.
  FORCED_CLOSE = 3;
  // A warning transaction is confirmed and its escrow is unspent. From this height on the claim of the trader who
  // published the warning is valid, and his service sends it. The redirect or the penalty transaction of the other
  // trader must be confirmed at this height at the latest.
  CLAIM_LOCK_TIME = 4;
}

message TradeDeadline {
  TradeDeadlineKind kind = 1;
  uint32 blockHeight = 2;
}

// Something that the service cannot do on its own, and that the user must do.
enum TradeUserAction {
  // The trade is terminated, so no step with the peer is possible any more. The trader must publish his warning
  // transaction when the warning lock time has passed, unless the peer publishes his own first.
  PUBLISH_WARNING = 0;
  // The seller's release is not accepted any more. The traders must agree on a custom payout, or a trader must
  // publish his warning transaction when the warning lock time has passed.
  START_DISPUTE = 1;
  // The trade is closed cooperatively and both payouts are unspent. The peer can still publish his warning
  // transaction, and the service answers it only while it runs. The user must spend his payout, or end the program in
  // the regular way, which moves the payout to the seed wallet.
  SPEND_OR_DRAIN_PAYOUT = 2;
}

message TradeEvent {
  string tradeId = 1;
  TradeEventType type = 2;
  // The height of the chain as the service sees it, or 0 if the chain is not known.
  uint32 currentBlockHeight = 3;
  // The state of the trade after the event. It is set in every event.
  TradeStateKind state = 4;
  // Set if the state is TRADE_CLOSED.
  optional ClosureKind closureType = 5;
  // Whether nothing can change for the trade any more.
  bool final = 6;
  // Set in an event of the type TX_SENT or TX_CONFIRMED.
  optional TradeTxKind txKind = 7;
  optional string txId = 8;
  // A description, in an event of the type LOSS, UNEXPECTED or CHAIN_PROBLEM.
  optional string message = 9;
  // Set in every event of a trade that was terminated because the peer did not follow the protocol: the reason.
  optional string terminationReason = 10;
  // The deadlines of the trade that are in force. Set in every event.
  repeated TradeDeadline deadlines = 11;
  // What the user must do at the moment. Set in every event.
  repeated TradeUserAction requiredActions = 12;
  // Set in an event of the type TX_CONFIRMED, together with txKind and txId. The kind DEPOSIT_ABORT_TX stands for
  // every transaction that spent an input of the deposit transaction in its place, whoever sent it.
  optional uint32 numConfirmations = 13;
}
