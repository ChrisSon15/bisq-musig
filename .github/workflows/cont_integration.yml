name: CI

# Every change is built, checked and tested as a whole workspace: the crates depend on each
# other, and a change in one of them can break another one.
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, clippy and tests of the workspace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.toml','**/Cargo.lock') }}
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build
        run: cargo build --all-targets
      - name: Clippy
        run: cargo clippy --all-targets
      # The tests start bitcoind for every test environment. They include the tests with two
      # musigd processes.
      - name: Unit and Integration tests
        run: RUST_LOG=off cargo test

  format:
    name: Formatting of the changed lines
    runs-on: ubuntu-latest
    # Several files of the repository are not formatted as a whole, so only the lines that a
    # change touches are checked. rustfmt can misjudge a line range that cuts through a
    # construct, so this job reports and does not block. A blocking check of the whole workspace
    # needs one commit that formats all files.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup nightly rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt
      - name: Check the formatting of the changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="HEAD~1"
          fi
          python3 .github/scripts/check-format.py "$(git merge-base "$base" HEAD)"

  audit:
    name: Audit of the dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Known vulnerabilities of the versions in Cargo.lock, from the RustSec advisory database.
      - name: Audit
        run: cargo audit

  java:
    name: Java test client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # The Java client is generated from the protobuf files of the rpc crate. A change of a
      # message that breaks the client is found here.
      - name: Compile the Java client and its tests
        run: mvn --batch-mode --no-transfer-progress -f rpc/pom.xml test-compile
